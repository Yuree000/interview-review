name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run gate checks
        run: |
          python -m scripts.run_phase1_gate
          python -m scripts.run_phase2_gate
          python -m scripts.run_phase3_gate
          python -m scripts.run_phase4_gate
          python -m scripts.run_phase5_gate
          python -m scripts.run_phase6_gate
